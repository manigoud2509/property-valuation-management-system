
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Property</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f2f5f9; }
        form { max-width: 520px; margin: auto; background: white; padding: 25px; border-radius: 10px; }
        h1 { text-align: center; color: #17365d; }
        label { display: block; margin-top: 12px; }
        input, select { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; }
        button { margin-top: 18px; padding: 12px; width: 100%; background: #17365d; color: white; border: 0; cursor: pointer; }
        #message { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>Edit Property</h1>

    <form id="editForm">
        <label>Property ID</label>
        <input type="number" name="property_id" min="1" required>

        <label>Owner Name</label>
        <input type="text" name="owner_name" required>

        <label>Property Type</label>
        <select name="property_type" required>
            <option value="">Select type</option>
            <option>House</option>
            <option>Apartment</option>
            <option>Land</option>
            <option>Commercial</option>
            <option>Other</option>
        </select>

        <label>Location</label>
        <input type="text" name="location" required>

        <label>Area (sq. ft.)</label>
        <input type="number" name="area" min="0.01" step="0.01" required>

        <label>Rate per sq. ft. (₹)</label>
        <input type="number" name="rate_per_sqft" min="0.01" step="0.01" required>

        <label>Property Age (years)</label>
        <input type="number" name="property_age" min="0" step="1" required>

        <button type="submit">Update Property</button>
        <p id="message"></p>
    </form>

    <p style="text-align:center"><a href="index.html">Back to Home</a></p>

    <script>
        document.getElementById("editForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const message = document.getElementById("message");
            message.textContent = "Updating property...";

            try {
                const response = await fetch("/edit-property", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams(new FormData(this))
                });
                const result = await response.text();
                message.textContent = result;
            } catch (error) {
                message.textContent = "Could not connect to the server.";
            }
        });
    </script>
</body>
</html>
