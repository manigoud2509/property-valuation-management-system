
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Property Valuation Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #123456, #2874a6);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .icon {
            font-size: 42px;
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            color: #123456;
            font-size: 23px;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2874a6;
            box-shadow: 0 0 4px rgba(40, 116, 166, 0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #123456;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2874a6;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            color: #c0392b;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
        }

        .footer {
            color: #777;
            font-size: 12px;
            text-align: center;
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="icon">🏠</div>

        <h1>Property Valuation</h1>
        <p class="subtitle">Management System Login</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">Login</button>
            <p id="message" role="alert"></p>
        </form>

        <p class="footer">
            Property Valuation Management System
        </p>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Please wait...";

            const formData = new URLSearchParams();
            formData.set(
                "username",
                document.getElementById("username").value.trim()
            );
            formData.set(
                "password",
                document.getElementById("password").value
            );

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body: formData.toString(),
                    redirect: "manual"
                });

                if (response.status === 0 ||
                    response.type === "opaqueredirect") {
                    window.location.href = "/dashboard";
                } else if (response.ok || response.redirected) {
                    window.location.href = "/dashboard";
                } else {
                    message.textContent =
                        "Invalid username or password. Please try again.";
                }
            } catch (error) {
                message.textContent =
                    "Unable to connect to the server. Please try again.";
            } finally {
                button.disabled = false;
                button.textContent = "Login";
            }
        });
    </script>
</body>
</html>
